<section class="space-y-6"><div><h1 class="text-3xl font-bold text-[#4A3B32]">Clientes</h1><p class="text-stone-500">Registro y búsqueda de clientes.</p></div><div *ngIf="error" class="p-3 bg-red-50 text-red-700 rounded-xl">{{error}}</div><div class="grid lg:grid-cols-3 gap-6"><form (ngSubmit)="guardar()" class="bg-white border rounded-2xl p-5 space-y-3"><h2 class="font-bold">{{editando?'Editar':'Nuevo'}} cliente</h2><input name="nombre" [(ngModel)]="cliente.nombre_cliente" placeholder="Nombre completo" class="w-full border rounded-lg p-2"><input name="rfc" [(ngModel)]="cliente.rfc" placeholder="RFC" class="w-full border rounded-lg p-2"><input name="tel" [(ngModel)]="cliente.telefono" placeholder="Teléfono" class="w-full border rounded-lg p-2"><input name="dom" [(ngModel)]="cliente.domicilio" placeholder="Domicilio" class="w-full border rounded-lg p-2"><button class="w-full bg-[#4A3B32] text-white rounded-lg p-2">Guardar cliente</button></form><div class="lg:col-span-2 bg-white border rounded-2xl p-5"><input [(ngModel)]="buscar" (ngModelChange)="cargar()" placeholder="Buscar cliente" class="w-full border rounded-lg p-2 mb-4"><div *ngFor="let c of clientes" class="flex justify-between border-b py-3"><span><b>{{c.nombre_cliente}}</b><br><small>{{c.rfc||'Sin RFC'}} · {{c.telefono||'Sin teléfono'}}</small><br><small>{{c.domicilio}}</small></span><span><button (click)="editar(c)" class="text-blue-700 mr-3">Editar</button><button (click)="eliminar(c)" class="text-red-700">Eliminar</button></span></div></div></div></section>
