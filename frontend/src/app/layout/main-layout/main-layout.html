<div class="flex h-screen w-full bg-[#F5F5F5] font-sans text-stone-800 overflow-hidden">

  <!-- ===============================
       BARRA LATERAL (componente reutilizable, con routing real)
       =============================== -->
  <app-sidebar [abierta]="sidebarAbierta()" [rol]="rolUsuario()" (cerrar)="cerrarSidebar()"></app-sidebar>

  <!-- ===============================
       ÁREA PRINCIPAL (CONTENEDOR)
       =============================== -->
  <main class="flex-1 flex flex-col h-full overflow-hidden relative">
    <!-- Encabezado Superior (Topbar) -->
    <header class="h-20 bg-transparent flex items-center justify-between px-8 shrink-0">
      <div class="flex items-center gap-3">
        <!-- Botón para abrir sidebar en móvil -->
        <button (click)="alternarSidebar()" class="lg:hidden p-2 text-stone-500 hover:text-stone-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div>
          <h1 class="text-2xl font-bold text-[#4A3B32]">¡Buenos días, {{ nombreUsuario() }}!</h1>
          <p class="text-sm text-stone-500 mt-1">Turno Matutino &bull; 07:00 AM - 03:00 PM</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <app-notificaciones-bell [rol]="rolUsuario()" />
      </div>
    </header>

    <!-- Contenido Dinámico -->
    <div class="flex-1 overflow-y-auto p-8 pt-2">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
