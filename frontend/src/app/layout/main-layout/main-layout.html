<div class="flex h-screen w-full bg-[#F5F5F5] font-sans text-stone-800 overflow-hidden relative">

  <!-- ===============================
       BARRA LATERAL (overlay en móvil, fija en desktop)
       =============================== -->
  <app-sidebar
    [abierta]="sidebarAbierta()"
    [rol]="rolUsuario()"
    (cerrar)="cerrarSidebar()"
    class="fixed lg:static inset-y-0 left-0 z-40 transition-transform duration-300 ease-in-out"
    [class.-translate-x-full]="!sidebarAbierta()"
    [class.translate-x-0]="sidebarAbierta()">
  </app-sidebar>

  <!-- Overlay oscuro detrás del sidebar en móvil -->
  @if (sidebarAbierta()) {
    <div
      class="fixed inset-0 bg-black/40 z-30 lg:hidden"
      (click)="cerrarSidebar()">
    </div>
  }

  <!-- ===============================
       ÁREA PRINCIPAL (CONTENEDOR)
       =============================== -->
  <main class="flex-1 flex flex-col h-full overflow-hidden relative min-w-0">

    <!-- Encabezado Superior (Topbar) -->
    <header class="min-h-[5rem] bg-transparent flex flex-col sm:flex-row sm:items-center justify-between gap-2 px-4 sm:px-6 lg:px-8 py-3 sm:py-0 shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Botón para abrir sidebar en móvil -->
        <button (click)="alternarSidebar()" class="lg:hidden p-2 text-stone-500 hover:text-stone-700 shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl lg:text-2xl font-bold text-[#4A3B32] truncate">
            ¡Buenos días, {{ nombreUsuario() }}!
          </h1>
          <p class="text-xs sm:text-sm text-stone-500 mt-1 truncate">
            Turno Matutino &bull; 07:00 AM - 03:00 PM
          </p>
        </div>
      </div>

      <div class="flex items-center gap-4 self-end sm:self-auto shrink-0">
        <app-notificaciones-bell [rol]="rolUsuario()" />
      </div>
    </header>

    <!-- Contenido Dinámico -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pt-2">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
