<!-- Overlay: fondo difuminado que cubre todo el homescreen -->
<div *ngIf="abierto"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"
  (click)="onCerrar()">

  <!-- Panel flotante: detenemos la propagación para no cerrar al clickear adentro -->
  <div (click)="$event.stopPropagation()"
    class="bg-white w-full max-w-4xl max-h-[85vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-stone-100 shrink-0">
      <div>
        <h2 class="text-lg font-bold text-[#4A3B32]">Gestión de cajeros</h2>
        <p class="text-xs text-stone-500 mt-0.5">Solo se muestran usuarios con rol de cajero</p>
      </div>
      <button type="button" (click)="onCerrar()"
        class="w-9 h-9 rounded-full flex items-center justify-center text-stone-400 hover:bg-stone-100 hover:text-[#4A3B32] transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Barra de acciones: búsqueda + nuevo -->
    <div class="flex items-center gap-3 px-6 py-4 border-b border-stone-100 shrink-0">
      <div class="relative flex-1">
        <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" [(ngModel)]="busqueda" (ngModelChange)="aplicarFiltro()"
          placeholder="Buscar cajero por nombre o usuario..."
          class="w-full pl-9 pr-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors" />
      </div>
      <button type="button" (click)="abrirNuevo()"
        class="shrink-0 bg-[#4A3B32] hover:bg-[#382b24] text-white text-sm font-semibold px-4 py-2 rounded-xl transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Nuevo cajero
      </button>
    </div>

    <!-- Contenido: lista o formulario -->
    <div class="flex-1 overflow-y-auto px-6 py-4">

      <!-- Error -->
      <div *ngIf="errorMsg && !mostrarFormulario"
        class="mb-4 text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2">
        {{ errorMsg }}
      </div>

      <!-- Cargando -->
      <div *ngIf="cargando && !mostrarFormulario" class="flex justify-center py-10">
        <svg class="animate-spin h-6 w-6 text-[#4A3B32]" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>

      <!-- ===================== LISTA DE CAJEROS ===================== -->
      <div *ngIf="!cargando && !mostrarFormulario">

        <div *ngIf="cajerosFiltrados.length === 0" class="text-center py-10 text-stone-400 text-sm">
          No hay cajeros que coincidan con tu búsqueda.
        </div>

        <div class="space-y-3">
          <div *ngFor="let c of cajerosFiltrados"
            class="flex items-center justify-between p-3 rounded-xl border border-stone-100 hover:border-stone-200 transition-colors">

            <div class="flex items-center gap-3">
              <div [class]="'w-10 h-10 rounded-full font-bold flex items-center justify-center text-sm ' + colorAvatar(c)">
                {{ iniciales(c) }}
              </div>
              <div>
                <p class="text-sm font-bold text-[#4A3B32]">{{ c.nombre_us }} {{ c.ap_us }} {{ c.am_us }}</p>
                <p class="text-xs text-stone-500">&#64;{{ c.usuario }} &middot; {{ c.telefono || 'Sin teléfono' }}</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <button type="button" (click)="abrirEditar(c)"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-stone-400 hover:bg-stone-100 hover:text-[#4A3B32] transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
              </button>
              <button type="button" (click)="confirmarEliminar(c)"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-stone-400 hover:bg-red-50 hover:text-red-600 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>

          </div>
        </div>
      </div>

      <!-- ===================== FORMULARIO CREAR/EDITAR ===================== -->
      <form *ngIf="mostrarFormulario" (ngSubmit)="guardar()" ngNativeValidate class="space-y-3 max-w-lg mx-auto">

        <div *ngIf="errorMsg"
          class="mb-2 text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2">
          {{ errorMsg }}
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Nombre *</label>
            <input type="text" [(ngModel)]="cajeroSeleccionado.nombre_us" name="nombre_us" required
              class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32]" />
          </div>
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Apellido Paterno *</label>
            <input type="text" [(ngModel)]="cajeroSeleccionado.ap_us" name="ap_us" required
              class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32]" />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Apellido Materno</label>
            <input type="text" [(ngModel)]="cajeroSeleccionado.am_us" name="am_us"
              class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32]" />
          </div>
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Teléfono</label>
            <input type="text" [(ngModel)]="cajeroSeleccionado.telefono" name="telefono" maxlength="10"
              class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32]" />
          </div>
        </div>

        <div>
          <label class="block text-[#4A3B32] text-xs font-bold mb-1">Dirección</label>
          <input type="text" [(ngModel)]="cajeroSeleccionado.direccion" name="direccion"
            class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32]" />
        </div>

        <div>
          <label class="block text-[#4A3B32] text-xs font-bold mb-1">Nombre de Usuario *</label>
          <input type="text" [(ngModel)]="cajeroSeleccionado.usuario" name="usuario" required
            [disabled]="modoEdicion"
            class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] disabled:opacity-60" />
        </div>

        <div *ngIf="!modoEdicion">
          <label class="block text-[#4A3B32] text-xs font-bold mb-1">Contraseña *</label>
          <input type="password" [(ngModel)]="cajeroSeleccionado.password" name="password" required
            class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-sm rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32]" />
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" (click)="cerrarFormulario()"
            class="flex-1 py-2.5 border border-stone-200 text-stone-500 text-sm font-semibold rounded-xl hover:bg-stone-50 transition-colors">
            Cancelar
          </button>
          <button type="submit" [disabled]="cargando"
            class="flex-1 py-2.5 bg-[#4A3B32] hover:bg-[#382b24] text-white text-sm font-semibold rounded-xl transition-colors disabled:opacity-70">
            {{ cargando ? 'Guardando...' : (modoEdicion ? 'Guardar cambios' : 'Crear cajero') }}
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
