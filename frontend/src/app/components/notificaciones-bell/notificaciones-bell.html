<div class="relative">
  <button type="button" (click)="toggle()"
    class="relative p-2 text-stone-400 hover:text-stone-600 transition-colors bg-white rounded-full shadow-sm">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    <span *ngIf="alertas.noLeidas() > 0"
      class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] font-bold flex items-center justify-center animate-pulse">
      {{ alertas.noLeidas() }}
    </span>
    <span *ngIf="alertas.noLeidas() === 0"
      class="absolute top-1 right-1 w-2.5 h-2.5 bg-[#8B5A33] rounded-full border-2 border-white"></span>
  </button>

  <div *ngIf="abierto()" class="fixed inset-0 z-40" (click)="abierto.set(false)"></div>

  <div *ngIf="abierto()"
    class="absolute right-0 mt-2 w-80 bg-white rounded-2xl shadow-2xl border border-stone-100 z-50 max-h-96 overflow-y-auto">
    <div class="flex items-center justify-between px-4 py-3 border-b border-stone-100 sticky top-0 bg-white">
      <p class="text-sm font-bold text-[#4A3B32]">Notificaciones</p>
      <button *ngIf="alertas.notificaciones().length" type="button" (click)="alertas.limpiarTodas()"
        class="text-xs text-stone-400 hover:text-red-500">Limpiar</button>
    </div>

    <div *ngIf="alertas.notificaciones().length === 0" class="text-center text-xs text-stone-400 py-8">
      Sin notificaciones
    </div>

    <div *ngFor="let n of alertas.notificaciones()" class="px-4 py-3 border-b border-stone-50 flex gap-3">
      <div class="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
        </svg>
      </div>
      <div>
        <p class="text-xs font-bold text-[#4A3B32]">{{ n.nombre_producto }} se agotó</p>
        <p class="text-[10px] text-stone-400">{{ formatoHora(n.fecha) }}</p>
      </div>
    </div>
  </div>
</div>
