<!-- CONTENEDOR PRINCIPAL: Fijo en pantalla, sin scroll -->
<div class="h-screen w-full flex flex-col lg:flex-row font-sans text-stone-800 bg-[#FDFBF7] overflow-hidden">

  <!-- ============================================================
       MITAD IZQUIERDA: Marca e Imagen (Fija)
       ============================================================ -->
  <div class="hidden lg:flex w-1/2 relative bg-stone-900 items-center justify-center overflow-hidden shrink-0">
    <!-- Imagen de fondo local -->
    <img src="/Kunibo.png" 
         class="absolute inset-0 w-full h-full object-cover opacity-50" 
         alt="Fondo de cafetería">
    
    <!-- CONTENIDO DE LA MARCA -->
    <div class="relative z-10 flex flex-col items-center text-center mt-[-10%]">
      <!-- Ícono de plantita minimalista SVG -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-16 h-16 text-[#FDFBF7] mb-4">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path>
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
      </svg>
      <h1 class="text-[#FDFBF7] text-6xl font-serif font-bold tracking-wide mb-3">Kunibo</h1>
      <p class="text-[#FDFBF7]/80 text-xs tracking-[0.3em] uppercase mb-8">• CAFÉ & EXPERIENCIAS •</p>
      <p class="text-[#FDFBF7] text-lg font-light leading-relaxed">
        Únete a nuestra comunidad,<br>crea momentos especiales.
      </p>
    </div>
  </div>

  <!-- ============================================================
       MITAD DERECHA: Formulario de Registro (Diseño compacto y fijo)
       ============================================================ -->
  <div class="w-full lg:w-1/2 h-full flex items-center justify-center p-4 sm:p-8 relative overflow-hidden">
    
    <!-- Decoración de fondo sutil -->
    <div class="absolute top-0 right-0 w-64 h-64 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+PHBhdGggZD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPjxwYXRo dD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPjxwYXRo dD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPjxwYXRo dD0iTTAgMGg0MHY0MEgweiIgZmlsbD0ibm9uZSIvPjxwYXRoIGQ9Ik0yMCAyMGMtNS41IDAtMTAtNC41LTEwLTEwUzE0LjUgMCAyMCAwczEwIDQuNSAxMCAxMC00LjUgMTAtMTAgMTB6IiBmaWxsPSIjZjRmMWVhIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiLz48L3N2Zz4=')] opacity-30 pointer-events-none"></div>

    <div class="w-full max-w-lg bg-white rounded-[2rem] p-6 sm:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative z-10">
      
      <!-- Encabezado -->
      <div class="text-center mb-4">
        <h2 class="text-2xl font-bold text-[#4A3B32] mb-1">Crear una cuenta</h2>
        <p class="text-stone-500 text-xs">Completa tus datos para registrarte en el sistema</p>
      </div>

      <!-- Alerta de Error del Servidor -->
      <div *ngIf="errorMsg" class="mb-4 text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
        {{ errorMsg }}
      </div>

      <!-- FORMULARIO CON VALIDACIÓN NATIVA -->
      <form (ngSubmit)="onRegistrar()" ngNativeValidate class="space-y-3">
        
        <!-- Fila 1 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Nombre *</label>
            <input type="text" [(ngModel)]="nombre_us" name="nombre_us" required
                   class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                   placeholder="Tu nombre" />
          </div>
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Apellido Paterno *</label>
            <input type="text" [(ngModel)]="ap_us" name="ap_us" required
                   class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                   placeholder="Apellido paterno" />
          </div>
        </div>

        <!-- Fila 2 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Apellido Materno</label>
            <input type="text" [(ngModel)]="am_us" name="am_us"
                   class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                   placeholder="Apellido materno" />
          </div>
          <div>
            <label class="block text-[#4A3B32] text-xs font-bold mb-1">Teléfono</label>
            <input type="text" [(ngModel)]="telefono" name="telefono"
                   class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                   placeholder="10 dígitos" />
          </div>
        </div>

        <!-- Dirección -->
        <div>
          <label class="block text-[#4A3B32] text-xs font-bold mb-1">Dirección</label>
          <input type="text" [(ngModel)]="direccion" name="direccion"
                 class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                 placeholder="Calle, número, colonia" />
        </div>

        <!-- Usuario -->
        <div>
          <label class="block text-[#4A3B32] text-xs font-bold mb-1">Nombre de Usuario *</label>
          <input type="text" [(ngModel)]="usuario" name="usuario" required
                 class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                 placeholder="usuario123" />
        </div>

        <!-- Contraseña -->
        <div>
          <label class="block text-[#4A3B32] text-xs font-bold mb-1">Contraseña *</label>
          <div class="relative">
            <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required
                   class="w-full px-3 pr-10 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                   placeholder="Mínimo 6 caracteres" />
            
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-stone-400 hover:text-[#4A3B32] transition-colors" (click)="mostrarPassword = !mostrarPassword">
              <svg *ngIf="!mostrarPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
              <svg *ngIf="mostrarPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>
            </div>
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div>
          <label class="block text-[#4A3B32] text-xs font-bold mb-1">Confirmar Contraseña *</label>
          <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="confirmarPassword" name="confirmarPassword" required
                   class="w-full px-3 py-2 bg-[#FDFBF7] border border-stone-200 text-stone-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-[#4A3B32]/20 focus:border-[#4A3B32] transition-colors placeholder:text-stone-400"
                   placeholder="Repite tu contraseña" />
        </div>

        <!-- Botón Registrarse -->
        <button type="submit" [disabled]="cargando"
                class="w-full bg-[#4A3B32] hover:bg-[#382b24] text-white rounded-xl py-2.5 font-semibold text-xs transition-colors disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center h-10 mt-2">
          <span *ngIf="!cargando">Crear cuenta</span>
          <svg *ngIf="cargando" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </button>

      </form>

      <!-- Enlace para volver al login -->
      <p class="text-center text-stone-500 text-xs mt-3">
        ¿Ya tienes cuenta? 
        <a href="javascript:void(0)" (click)="onVolverLogin()" class="text-[#8B5A33] font-bold hover:text-[#4A3B32] transition-colors">Inicia sesión aquí</a>
      </p>

    </div>
  </div>
</div>
